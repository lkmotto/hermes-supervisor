version: "3.8"

services:
  hermes:
    image: node:24-alpine
    container_name: hermes
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c '
        apk add --no-cache git python3 make g++ &&
        rm -rf /app/* /app/.[!.]* 2>/dev/null || true &&
        git clone --depth 1 https://github.com/lkmotto/hermes-supervisor.git /tmp/src &&
        cp -r /tmp/src/. /app/ &&
        rm -rf /tmp/src &&
        npm ci &&
        npm run build &&
        mkdir -p /data &&
        exec node dist/index.js --http --host 0.0.0.0 --port 8150
      '
    ports:
      - "8150:8150"
    environment:
      - HOSTINGER_API_TOKEN=${HOSTINGER_API_TOKEN}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - HERMES_VPS_ID=1511806
      - HERMES_DB_PATH=/data/hermes.db
      - HERMES_MCP_AUTH_TOKEN=${HERMES_MCP_AUTH_TOKEN}
      - FACTORY_API_KEY=${FACTORY_API_KEY}
    volumes:
      - hermes_data:/data

volumes:
  hermes_data:
